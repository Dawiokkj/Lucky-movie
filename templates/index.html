<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta de Filmes · Letterboxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-cinema-bg bg-radial-cinema text-cream-base font-body min-h-screen sm:h-screen flex flex-col justify-between overflow-x-hidden selection:bg-gold-base selection:text-cinema-bg">


  <!-- Main Container Centered in Viewport -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-8 py-4 sm:py-6 flex flex-col justify-center gap-4 sm:gap-6">

    <!-- Header Marquee -->
    <header class="text-center shrink-0">
      <div class="inline-flex items-center gap-2 px-3 py-0.5 rounded-full bg-cinema-panel border border-cinema-border/80 shadow-inner mb-2 sm:mb-3">
        <span class="w-2 h-2 rounded-full bg-gold-bright animate-ping"></span>
        <p class="font-body text-[11px] sm:text-xs font-semibold tracking-[0.25em] uppercase text-gold-bright">agora em cartaz</p>
      </div>
      <h1 class="font-display text-4xl sm:text-6xl md:text-7xl tracking-wide leading-none text-cream-base drop-shadow-[0_0_25px_rgba(242,201,109,0.2)] mb-2 sm:mb-3">
        Roleta de <span class="text-gold-bright bg-gradient-to-b from-gold-bright to-gold-base bg-clip-text text-transparent">Filmes</span>
      </h1>
      <p class="font-serif text-sm sm:text-base text-muted-base leading-relaxed max-w-[54ch] mx-auto">
        Cole seu perfil e uma lista do Letterboxd. A gente elimina os filmes que você já viu e sorteia o melhor do resto.
      </p>
    </header>

    <!-- Ticket Form Section -->
    <section class="ticket-notch bg-cinema-panel border border-cinema-border rounded-xl p-4 sm:p-6 shadow-2xl backdrop-blur-sm relative overflow-hidden shrink-0" id="form-section">
      <!-- Ambient lighting glow -->
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-gold-base/10 rounded-full blur-3xl pointer-events-none"></div>

      <form id="sortear-form" class="relative z-10 space-y-2">
        <div class="grid grid-cols-12 gap-3 items-end">
          <div class="col-span-12">
            <label for="link-usuario" class="block font-body text-[11px] sm:text-xs font-semibold tracking-[0.18em] uppercase text-muted-base mb-1.5">
              Seu Perfil no Letterboxd
            </label>
            <input
              type="text"
              id="link-usuario"
              name="usuario"
              placeholder="https://letterboxd.com/seu-usuario"
              required
              autocomplete="off"
              class="w-full h-12 box-border bg-cinema-bg border border-cinema-border rounded-lg px-4 text-cream-base font-body text-sm sm:text-base placeholder:text-muted-base/40 focus:outline-none focus:border-gold-base focus:ring-1 focus:ring-gold-base transition duration-200 shadow-inner"
            >
          </div>

          <div class="col-span-10">
            <label for="link-lista" class="block font-body text-[11px] sm:text-xs font-semibold tracking-[0.18em] uppercase text-muted-base mb-1.5">
              Link da Lista
            </label>
            <input
              type="url"
              id="link-lista"
              name="link"
              placeholder="https://boxd.it/8HjM"
              required
              autocomplete="off"
              class="w-full h-12 box-border bg-cinema-bg border border-cinema-border rounded-lg px-4 text-cream-base font-body text-sm sm:text-base placeholder:text-muted-base/40 focus:outline-none focus:border-gold-base focus:ring-1 focus:ring-gold-base transition duration-200 shadow-inner"
            >
          </div>

          <div class="col-span-2">
            <button
              type="submit"
              id="sortear-btn"
              class="w-full h-12 box-border border border-transparent font-display text-xl tracking-wider uppercase bg-gradient-to-b from-gold-bright to-gold-base text-cinema-bg font-bold px-4 rounded-lg shadow-md hover:brightness-110 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-150 flex items-center justify-center"
            >
              <span>Sortear</span>
            </button>
          </div>
        </div>

        <p class="font-body text-xs text-gold-bright/90 pt-0.5" id="stats-hint"></p>
      </form>
    </section>

    <!-- Screening Results Area -->
    <section id="resultado" aria-live="polite">

      <!-- Placeholder Card -->
      <div class="text-center p-6 sm:p-10 border border-dashed border-cinema-border/80 rounded-xl bg-cinema-panel/60 backdrop-blur-sm my-auto" id="placeholder-card">
        <div class="font-display text-6xl sm:text-7xl text-gold-base mark-flicker-anim mb-2 select-none" aria-hidden="true">?</div>
        <p class="font-display text-lg sm:text-xl tracking-wider text-cream-base uppercase mb-1">nenhum filme sorteado ainda</p>
        <p class="font-body text-xs sm:text-sm text-muted-base">preencha os campos acima e aperte "sortear"</p>
      </div>

      <!-- Reel Spinner (Loading State) -->
      <div class="text-center py-6 my-auto" id="reel" hidden>
        <div class="flex justify-center items-center gap-2 sm:gap-3 overflow-hidden mb-3">
          <div class="w-10 sm:w-12 h-14 sm:h-16 border-2 border-gold-base rounded bg-gradient-to-br from-cinema-panel-alt to-cinema-panel reel-frame-anim"></div>
          <div class="w-10 sm:w-12 h-14 sm:h-16 border-2 border-gold-base rounded bg-gradient-to-br from-cinema-panel-alt to-cinema-panel reel-frame-anim [animation-delay:0.1s]"></div>
          <div class="w-10 sm:w-12 h-14 sm:h-16 border-2 border-gold-base rounded bg-gradient-to-br from-cinema-panel-alt to-cinema-panel reel-frame-anim [animation-delay:0.2s]"></div>
          <div class="w-10 sm:w-12 h-14 sm:h-16 border-2 border-gold-base rounded bg-gradient-to-br from-cinema-panel-alt to-cinema-panel reel-frame-anim [animation-delay:0.3s]"></div>
          <div class="w-10 sm:w-12 h-14 sm:h-16 border-2 border-gold-base rounded bg-gradient-to-br from-cinema-panel-alt to-cinema-panel reel-frame-anim [animation-delay:0.4s]"></div>
          <div class="w-10 sm:w-12 h-14 sm:h-16 border-2 border-gold-base rounded bg-gradient-to-br from-cinema-panel-alt to-cinema-panel reel-frame-anim [animation-delay:0.5s]"></div>
        </div>
        <p class="font-display text-base sm:text-lg tracking-widest text-gold-bright uppercase animate-pulse">girando o rolo de filme&hellip;</p>
      </div>

      <!-- Alert Error Box -->
      <div class="bg-cinema-panel border border-error-base text-cream-base rounded-xl p-5 font-serif text-sm sm:text-base leading-relaxed shadow-lg my-auto" id="alert" hidden></div>

      <!-- Poster Card (Result) -->
      <article class="relative flex flex-col sm:flex-row gap-6 sm:gap-8 bg-cinema-panel border border-cinema-border rounded-xl p-5 sm:p-7 overflow-hidden shadow-2xl card-rise-anim my-auto" id="poster-card" hidden>
        <div class="curtain curtain--left" aria-hidden="true"></div>
        <div class="curtain curtain--right" aria-hidden="true"></div>

        <div class="shrink-0 mx-auto sm:mx-0 w-36 sm:w-44 md:w-48">
          <img id="poster-img" src="" alt="" class="w-full aspect-[2/3] object-cover rounded-lg border border-cinema-border bg-cinema-panel-alt shadow-lg">
        </div>

        <div class="flex-1 min-w-0 flex flex-col justify-between">
          <div>
            <h2 class="font-display text-3xl sm:text-4xl lg:text-5xl leading-tight text-cream-base mb-1.5">
              <span id="filme-titulo"></span>
              <span class="text-gold-base text-2xl sm:text-3xl ml-2 font-display" id="filme-ano"></span>
            </h2>
            <p class="font-body text-xs sm:text-sm font-semibold tracking-widest uppercase text-muted-base mb-3" id="filme-diretor-wrapper">
              dirigido por <span class="text-gold-bright" id="filme-diretor"></span>
            </p>
            <p class="font-serif text-sm sm:text-base text-cream-base/90 leading-relaxed mb-4 line-clamp-4 md:line-clamp-6" id="filme-sinopse"></p>
          </div>
          <div>
            <a id="filme-link" class="inline-flex items-center gap-2 font-body font-semibold text-sm text-gold-bright hover:text-gold-base border-b border-gold-bright hover:border-gold-base pb-0.5 transition duration-150" href="#" target="_blank" rel="noopener">
              ver no Letterboxd &rarr;
            </a>
          </div>
        </div>
      </article>

    </section>

  </main>


  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
